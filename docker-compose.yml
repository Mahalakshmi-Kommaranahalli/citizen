services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: nagarseva-civic-app
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - NODE_ENV=production
    restart: unless-stopped
    volumes:
      - ./server/data:/app/server/data
      - ./server/uploads:/app/server/uploads

