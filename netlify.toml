# ==============================================================================
# Netlify Configuration for NagarSeva Full-Stack Civic Grievance System
# ==============================================================================

[build]
  command = "npm run build"
  publish = "client/dist"
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "20"
  NETLIFY = "true"

[functions]
  node_bundler = "esbuild"
  included_files = ["server/**"]

# Forward all API traffic to the serverless Express function
[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/api/api/:splat"
  status = 200

# Alternate redirect for root /api
[[redirects]]
  from = "/api"
  to = "/.netlify/functions/api/api"
  status = 200

# Client-side SPA fallback for React Router / HTML5 History
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
